<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sayar Giyim - Siyah beyaz giyim. Kapıda ödeme ile alışveriş."><title>Sayar Giyim | Kapıda Ödeme</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff}header{position:sticky;top:0;z-index:5;background:#000;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-weight:900;letter-spacing:2px}.btn{border:0;border-radius:7px;padding:11px 15px;background:#000;color:#fff;cursor:pointer;font-weight:700}.btn.white{background:#fff;color:#000}.btn:disabled{opacity:.5;cursor:not-allowed}.hero{background:#111;color:#fff;text-align:center;padding:70px 20px}.hero h1{font-size:44px;margin:0 0 10px}.wrap{max-width:1150px;margin:auto;padding:35px 5%}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.toolbar input,.toolbar select,.box input,.box textarea,.box select{width:100%;padding:11px;border:1px solid #ccc;border-radius:6px}.toolbar input{max-width:400px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{border:1px solid #ddd;border-radius:9px;overflow:hidden;background:#fff}.pic{height:250px;background:#eee;display:flex;align-items:center;justify-content:center;color:#777}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:15px}.price{font-weight:800;font-size:18px}.muted{color:#666;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;padding:20px}.box{background:#fff;width:min(760px,100%);margin:3vh auto;padding:22px;border-radius:10px;max-height:94vh;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.order-item{padding:10px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px}.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #ddd;padding:15px;border-radius:8px}.stat b{font-size:24px;display:block}.table{width:100%;border-collapse:collapse;margin-top:15px}.table th,.table td{padding:9px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}.notice{background:#f5f5f5;padding:12px;border-radius:7px;margin:10px 0}.links{text-align:center;padding:30px}.links a{color:#111;margin:0 8px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.admin-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:10px}.pic{height:180px}.hero h1{font-size:32px}.row{grid-template-columns:1fr}.box{padding:16px}.table{font-size:12px}}
</style></head><body><header><div class="logo">SAYAR GİYİM</div><div><button class="btn white" onclick="openCart()">Sepet (<span id="cnt">0</span>)</button> <button class="btn white" onclick="openAdmin()">Yönetim</button></div></header><section class="hero"><h1>SAYAR GİYİM</h1><p>Siyah & beyaz tarzını keşfet.</p><p><b>Kapıda ödeme</b> ile güvenli sipariş.</p></section><main class="wrap"><div class="toolbar"><input id="search" placeholder="Ürün ara..." oninput="renderProducts()"><select id="cat" onchange="renderProducts()"><option value="">Tüm kategoriler</option></select></div><div id="products" class="grid"></div></main><div class="links"><a href="/gizlilik.html">Gizlilik</a><a href="/iade.html">İade ve değişim</a><a href="/sartlar.html">Satış şartları</a></div>
<div id="cart" class="modal"><div class="box"><button class="btn" onclick="closeM('cart')">Kapat</button><h2>Sepet</h2><div id="list"></div><h3 id="total">Toplam: 0 TL</h3><div class="notice">Ödeme yöntemi: <b>Kapıda Ödeme</b></div><div class="row"><div><label>Ad Soyad *</label><input id="name"></div><div><label>Telefon *</label><input id="phone" placeholder="05xx xxx xx xx"></div></div><div class="row"><div><label>Şehir</label><input id="city"></div><div><label>Adres *</label><textarea id="address" rows="3"></textarea></div></div><label>Sipariş notu</label><textarea id="note" rows="2" placeholder="Varsa notunuz"></textarea><br><br><button class="btn" onclick="order()">Kapıda Ödeme ile Sipariş Ver</button></div></div>
<div id="admin" class="modal"><div class="box"><button class="btn" onclick="closeM('admin')">Kapat</button><h2>Yönetim Paneli</h2><div id="login"><input id="email" placeholder="E-posta"><input id="pass" type="password" placeholder="Şifre"><br><br><button class="btn" onclick="loginAdmin()">Giriş Yap</button></div><div id="panel"></div></div></div>
<script>
let P=[],C=[];const money=x=>Number(x).toLocaleString('tr-TR')+' TL';
async function load(){const r=await fetch('/api/products');P=await r.json();const cats=[...new Set(P.map(p=>p.category))];cat.innerHTML='<option value="">Tüm kategoriler</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');renderProducts()}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function renderProducts(){const q=search.value.toLowerCase(),c=cat.value;const arr=P.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!c||p.category===c));products.innerHTML=arr.map(p=>`<div class="card"><div class="pic">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'Ürün görseli'}</div><div class="info"><b>${esc(p.name)}</b><div class="muted">${esc(p.category)}</div><p class="price">${money(p.price)}</p><small>${p.stock>0?'Stok: '+p.stock:'Tükendi'}</small><br><br><button class="btn" onclick="add(${p.id})" ${p.stock<1?'disabled':''}>Sepete Ekle</button></div></div>`).join('')||'<p>Aradığınız ürün bulunamadı.</p>'}
function add(id){const p=P.find(x=>x.id===id),x=C.find(x=>x.id===id);if(!p||p.stock<1)return;if(x){if(x.qty<p.stock)x.qty++}else C.push({id,qty:1});updateCount();openCart()}
function updateCount(){cnt.textContent=C.reduce((s,x)=>s+x.qty,0)}
function openCart(){cart.style.display='block';renderCart()}function renderCart(){list.innerHTML=C.map(x=>{const p=P.find(p=>p.id===x.id);return p?`<div class="order-item"><span>${esc(p.name)} × ${x.qty}</span><span>${money(p.price*x.qty)} <button class="btn" onclick="removeItem(${x.id})">−</button></span></div>`:''}).join('')||'<p>Sepet boş.</p>';total.textContent='Toplam: '+money(C.reduce((s,x)=>s+(P.find(p=>p.id===x.id)?.price||0)*x.qty,0))}function removeItem(id){const x=C.find(x=>x.id===id);if(!x)return;x.qty--;if(x.qty<=0)C=C.filter(x=>x.id!==id);updateCount();renderCart()}
function closeM(x){document.getElementById(x).style.display='none'}
async function order(){if(!C.length)return alert('Sepet boş.');if(!name.value.trim()||!phone.value.trim()||!address.value.trim())return alert('Ad soyad, telefon ve adres zorunludur.');const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_name:name.value,phone:phone.value,address:address.value,city:city.value,note:note.value,items:C})});const d=await r.json();if(!r.ok)return alert(d.error||'Sipariş oluşturulamadı.');alert('Siparişiniz alındı! Sipariş numaranız: #'+d.orderId+'\nÖdeme: Kapıda Ödeme\nToplam: '+money(d.total));C=[];updateCount();closeM('cart');load()}
function openAdmin(){admin.style.display='block'}
async function loginAdmin(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})});if(!r.ok)return alert('Giriş başarısız.');document.querySelector('#login').style.display='none';loadPanel()}
async function loadPanel(){const [o,s]=await Promise.all([fetch('/api/orders').then(r=>r.json()),fetch('/api/stats').then(r=>r.json())]);panel.innerHTML=`<div class="admin-grid"><div class="stat">Sipariş<b>${s.orders}</b></div><div class="stat">Ciro<b>${money(s.revenue)}</b></div><div class="stat">Ürün<b>${s.products}</b></div><div class="stat">Az stok<b>${s.lowStock}</b></div></div><hr><h3>Ürün Ekle</h3><div class="row"><input id="pn" placeholder="Ürün adı"><input id="pc" placeholder="Kategori"><input id="pp" type="number" placeholder="Fiyat"><input id="ps" type="number" placeholder="Stok"><input id="pi" placeholder="Görsel URL"></div><br><button class="btn" onclick="addP()">Ürün Ekle</button><h3>Siparişler</h3><table class="table"><tr><th>#</th><th>Müşteri</th><th>Ürünler</th><th>Tutar</th><th>Durum</th></tr>${o.map(x=>`<tr><td>#${x.id}</td><td>${esc(x.customer_name)}<br>${esc(x.phone)}<br>${esc(x.city)}</td><td>${(x.items||[]).map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</td><td>${money(x.total)}<br>Kapıda Ödeme</td><td><select onchange="status(${x.id},this.value)">${['Yeni','Onaylandı','Hazırlanıyor','Kargoda','Teslim Edildi','İptal'].map(v=>`<option ${v===x.status?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</table><h3>Ürün Yönetimi</h3>${P.map(p=>`<div class="order-item"><span><b>${esc(p.name)}</b> — ${money(p.price)} — stok ${p.stock}</span><span><button class="btn" onclick="editP(${p.id})">Düzenle</button> <button class="btn" onclick="delP(${p.id})">Gizle</button></span></div>`).join('')}`}
async function addP(){await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:pn.value,category:pc.value,price:+pp.value,stock:+ps.value,image:pi.value})});await load();loadPanel()}
async function editP(id){const p=P.find(x=>x.id===id);const name=prompt('Ürün adı',p.name);if(name===null)return;const price=prompt('Fiyat',p.price),stock=prompt('Stok',p.stock);await fetch('/api/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price:+price,stock:+stock})});await load();loadPanel()}
async function delP(id){if(!confirm('Bu ürünü mağazada gizlemek istiyor musunuz?'))return;await fetch('/api/products/'+id,{method:'DELETE'});await load();loadPanel()}
async function status(id,status){await fetch('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadPanel()}
load();
</script></body></html>
